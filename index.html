<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171f">
<title>단어장</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 class="app-title">단어장</h1>
    <button id="folderSwitchBtn" class="folder-switch" type="button">
      <span id="currentFolderName">폴더</span>
      <span class="folder-switch-caret" aria-hidden="true">▾</span>
    </button>
  </header>

  <main class="screen-wrap">
    <!-- 추가창 -->
    <section id="addScreen" class="screen active" aria-label="단어 추가 화면">
      <div class="segmented" role="tablist">
        <button class="seg-btn active" data-subview="addForm" role="tab" aria-selected="true" type="button">단어 추가</button>
        <button class="seg-btn" data-subview="wordList" role="tab" aria-selected="false" type="button">전체 목록</button>
      </div>

      <div id="addForm" class="subview active">
        <form id="wordForm" class="word-form" autocomplete="off">
          <label class="field">
            <span class="field-label">단어</span>
            <input type="text" id="wordInput" placeholder="예: ephemeral" required>
          </label>
          <label class="field">
            <span class="field-label">뜻</span>
            <input type="text" id="meaningInput" placeholder="예: 순식간의, 덧없는" required>
          </label>
          <button type="submit" class="btn btn-primary">저장</button>
          <p id="saveMsg" class="save-msg" role="status"></p>
        </form>
      </div>

      <div id="wordList" class="subview">
        <div class="list-header">
          <span class="list-count" id="wordCount">0개</span>
          <button id="showDeletedBtn" class="link-btn" type="button">삭제된 단어 보기</button>
        </div>
        <ul id="wordListItems" class="word-list"></ul>
        <p id="listEmpty" class="empty-msg" hidden>아직 추가한 단어가 없어요. '단어 추가'에서 첫 단어를 등록해보세요.</p>
      </div>
    </section>

    <!-- 암기창 -->
    <section id="memorizeScreen" class="screen" aria-label="암기 화면">
      <div class="memorize-top">
        <span id="progressLabel" class="progress-label">0 / 0</span>
        <button id="reshuffleBtn" class="link-btn" type="button">다시 섞기</button>
      </div>

      <div id="cardStage" class="card-stage">
        <div id="wordCard" class="word-card">
          <p id="cardWord" class="card-word"></p>
          <div class="meaning-wrap">
            <p id="cardMeaning" class="card-meaning"></p>
            <div id="cardCover" class="card-cover">
              <span>탭해서 뜻 보기</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card-controls">
        <button id="checkBtn" class="btn btn-check" type="button">✓ 체크</button>
        <button id="deleteBtn" class="btn btn-delete" type="button">삭제</button>
      </div>

      <p id="memorizeEmpty" class="empty-msg" hidden>암기할 단어가 없어요. 먼저 단어를 추가해주세요.</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="addScreen" type="button">
      <span class="nav-icon" aria-hidden="true">＋</span>
      <span class="nav-label">추가</span>
    </button>
    <button class="nav-btn" data-screen="memorizeScreen" type="button">
      <span class="nav-icon" aria-hidden="true">◐</span>
      <span class="nav-label">암기</span>
    </button>
  </nav>

  <div id="folderModal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>폴더</h2>
        <button id="closeFolderBtn" class="icon-btn" aria-label="닫기" type="button">✕</button>
      </div>
      <ul id="folderListItems" class="folder-list"></ul>
      <form id="newFolderForm" class="new-folder-form" autocomplete="off">
        <input type="text" id="newFolderInput" placeholder="새 폴더 이름" required>
        <button type="submit" class="btn btn-primary btn-sm">추가</button>
      </form>
    </div>
  </div>

  <div id="deletedModal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>삭제된 단어</h2>
        <button id="closeDeletedBtn" class="icon-btn" aria-label="닫기" type="button">✕</button>
      </div>
      <ul id="deletedListItems" class="word-list"></ul>
      <p id="deletedEmpty" class="empty-msg" hidden>삭제된 단어가 없어요.</p>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
